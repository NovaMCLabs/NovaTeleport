# 传送石碑配置（中英）Teleportation Steles configuration
enabled: true

# 激活石碑的消耗
activation:
  item_required: "ENDER_PEARL"
  item_amount: 1
  xp_level_cost: 5

# 每次使用石碑传送的消耗
teleport_cost:
  xp_level_cost: 1
  vault_cost: 100

# 结构定义：以 core_block 为中心，按 frame 中的相对坐标校验外圈方块
structures:
  default_ruin:
    name: "远古石碑"
    core_block: "LODESTONE"
    frame:
      - "-1,-1,-1:MOSSY_STONE_BRICKS"
      - "0,-1,-1:MOSSY_STONE_BRICKS"
