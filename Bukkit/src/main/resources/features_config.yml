# NovaTeleport 功能配置文件
# NovaTeleport Features Configuration
#
# 说明：本文件只包含由本文件读取的功能开关。
# 其他功能的配置分别在：
#   - config.yml             经济、世界阈值传送、RTP基础、动画/特效
#   - guild_config.yml       工会系统
#   - toll_warps_config.yml  付费传送点
#   - party.yml / death.yml / steles.yml / portals.yml / rtp.yml / scrolls.yml
#   - java_menus.yml         Java 版 GUI 菜单
#   - langs/*.yml            语言文件

# ====================================
# Towny 城镇传送
# Towny Town Teleportation
# ====================================
towny:
  enabled: false
  # 传送到自己城镇的延迟（秒）
  home_delay: 3
  # 传送到其他城镇的延迟（秒）
  other_delay: 5
  # 传送费用（Vault）
  home_cost: 0.0
  other_cost: 10.0

# ====================================
# 传送日志与回溯
# Teleport Log and Rewind
# ====================================
teleport_log:
  enabled: true
  # 保留日志天数
  retention_days: 30
  # 记录的传送类型（需与 TeleportUtil 的 type 参数一致）
  log_types:
    - tpa
    - tpahere
    - home
    - warp
    - spawn
    - rtp
    - back
    - portal
    - stele
    - city
    - party
    - guild
    - towny
    - tollwarp
    - deathback
    - scroll
    - rewind
    - auto_world_teleport
  # 允许回溯的权限节点
  rewind_permission: "novateleport.admin.rewind"
