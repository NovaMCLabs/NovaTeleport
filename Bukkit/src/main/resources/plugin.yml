name: NovaTeleport
version: 2.0-SNAPSHOT
main: com.novamclabs.StarTeleport
# 插件只使用长期稳定的 Bukkit API，且编译基线取最短的那一端（spigot-api 1.20.1），
# 因此同一个 jar 可在 1.20.x / 1.21.x / 26.x（26.1 / 26.1.2 / 26.2 …）上加载。
#
# api-version 取 1.20：这是所有受支持服务端都认得的最高「最低值」——
# 服务端只拒绝比自身新的 api-version，声明 1.20 在 1.20.1 与 26.2 上都不会被拒。
#
# 字节码目标为 Java 17：1.20.0–1.20.4 的服务端只需要 Java 17（很多这类服仍跑在 17 上），
# 而 1.20.5+ / 1.21.x（Java 21）与 26.x（Java 25）都能向上兼容加载 17 字节码。
api-version: '1.20'
folia-supported: true
softdepend: [Vault, PlaceholderAPI, floodgate, Geyser, Parties, BetterTeams, SimpleClans, Factions, Guilds, WorldGuard, PlotSquared, Residence, Lands, GriefDefender, Towny, ItemsAdder, MMOItems]

permissions:
  novateleport.pass:
    description: Allows a player to trigger world-threshold teleports
    default: op
  novateleport.command.reload:
    description: Allows reloading the plugin configuration
    default: op
  novateleport.admin:
    description: NovaTeleport administrator permission
    default: op
  novateleport.command.tpa:
    description: Use /tpa
    default: true
  novateleport.command.tpahere:
    description: Use /tpahere
    default: true
  novateleport.command.tpaccept:
    description: Use /tpaccept
    default: true
  novateleport.command.tpdeny:
    description: Use /tpdeny
    default: true
  novateleport.command.tpcancel:
    description: Use /tpcancel
    default: true
  novateleport.command.home:
    description: Use /home /sethome /delhome /homes
    default: true
  novateleport.command.warp:
    description: Use /warp /warps
    default: true
  novateleport.command.setwarp:
    description: Use /setwarp /delwarp
    default: op
  novateleport.command.spawn:
    description: Use /spawn
    default: true
  novateleport.command.back:
    description: Use /back
    default: true
  novateleport.command.rtp:
    description: Use /rtp
    default: true
  novateleport.economy.bypass:
    description: Bypass teleport costs
    default: op
  novateleport.animation.select:
    description: Allows a player to choose an animation style
    default: true
  novateleport.animation.tech:
    description: Unlock the tech animation style
    default: op
  novateleport.animation.natural:
    description: Unlock the natural animation style
    default: op
  novateleport.scroll.bind:
    description: Allows a player to bind teleport scrolls
    default: op
  novateleport.command.party:
    description: Use the /party command
    default: true

  novateleport.command.tpmenu:
    description: Use /tpmenu to open the teleport menu
    default: true

  novateleport.guild.use:
    description: Use /gtp list and /gtp info
    default: true
  novateleport.guild.home:
    description: Use /gtp home for guild home teleports
    default: true
  novateleport.guild.warp:
    description: Use /gtp warp for guild warp points
    default: true
  novateleport.guild.admin:
    description: Manage guild homes and warp points
    default: op

  novateleport.towny.home:
    description: Teleport to your own town
    default: true
  novateleport.towny.other:
    description: Teleport to other towns
    default: op

  novateleport.stele.use:
    description: Use teleport steles (list/locate/travel)
    default: true
  novateleport.toll.use:
    description: Use paid warp points (list/mywarps/tp)
    default: true
  novateleport.toll.create:
    description: Create paid warp points
    default: true
  novateleport.toll.delete:
    description: Delete your own paid warp points
    default: true
  novateleport.toll.delete.others:
    description: Delete other players' paid warp points
    default: op
  novateleport.toll.bypass:
    description: Use paid warp points for free
    default: op

  novateleport.admin.rewind:
    description: Use /tplog to rewind a player's teleports
    default: op

  # 以下三项只在对应配置节启用时才有意义（combat_tag / damage_interrupt /
  # teleport_cooldowns 默认都是关闭的），权限节点本身可在 config.yml 里改名
  novateleport.combat.bypass:
    description: Start teleports while in combat
    default: false
  novateleport.damage.bypass:
    description: Taking damage does not interrupt the teleport countdown
    default: false
  novateleport.cooldown.bypass:
    description: Bypass teleport cooldowns
    default: false

commands:
  stp:
    description: Reload the plugin configuration
    usage: /stp reload
    permission: novateleport.command.reload
  tpa:
    description: Request a teleport to a player
    usage: /tpa <player>
    permission: novateleport.command.tpa
  tpahere:
    description: Request that a player teleports to you
    usage: /tpahere <player>
    permission: novateleport.command.tpahere
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
    permission: novateleport.command.tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
    permission: novateleport.command.tpdeny
  tpcancel:
    description: Cancel a teleport request you sent
    usage: /tpcancel
    permission: novateleport.command.tpcancel
  sethome:
    description: Set a home
    usage: /sethome [name]
    permission: novateleport.command.home
  home:
    description: Teleport to a home
    usage: /home [name]
    permission: novateleport.command.home
  delhome:
    description: Delete a home
    usage: /delhome [name]
    permission: novateleport.command.home
  setwarp:
    description: Set a public warp point
    usage: /setwarp <name>
    permission: novateleport.command.setwarp
  warp:
    description: Go to a public warp point (opens the menu without arguments)
    usage: /warp [name]
    permission: novateleport.command.warp
  delwarp:
    description: Delete a public warp point
    usage: /delwarp <name>
    permission: novateleport.command.setwarp
  spawn:
    description: Go to the spawn point
    usage: /spawn
    permission: novateleport.command.spawn
  back:
    description: Return to your previous location
    usage: /back
    permission: novateleport.command.back
  rtp:
    description: Random teleport (opens the menu without arguments)
    usage: /rtp [now|start|radius]
    permission: novateleport.command.rtp
  tpanimation:
    description: Choose a teleport animation style
    usage: /tpanimation select <magic|tech|natural>
    permission: novateleport.animation.select
  scroll:
    description: Teleport scroll command
    usage: /scroll bind <home|warp> <name>
    permission: novateleport.scroll.bind
  city:
    description: Return to town
    usage: /city
    permission: novateleport.command.spawn
    aliases: [hub]
  novateleport:
    description: NovaTeleport main command
    usage: /novateleport <subcommand>
    aliases: [ntp, novatp]
  party:
    description: Party system
    usage: /party <create|invite|accept|leave|tp>
    permission: novateleport.command.party
  stele:
    description: Teleport stele system
    usage: /stele <list|locate|create|remove|travel|activatefor>
  deathback:
    description: Return to your last death location
    usage: /deathback
    permission: novateleport.command.back
  forcetp:
    description: Force-teleport an offline player (console too)
    usage: /forcetp <player> <world> <x> <y> <z>
    permission: novateleport.admin

  homes:
    description: List/select your homes
    usage: /homes
    permission: novateleport.command.home

  warps:
    description: List/select public warp points
    usage: /warps
    permission: novateleport.command.warp

  rtpgui:
    description: Open the random teleport GUI
    usage: /rtpgui
    permission: novateleport.command.rtp

  tpmenu:
    description: Open the teleport menu
    usage: /tpmenu
    permission: novateleport.command.tpmenu
    aliases: [tpm]

  gtp:
    description: Guild teleports
    usage: /gtp <home|sethome|warp|setwarp|delwarp|list|info>

  towntp:
    description: Towny town teleport
    usage: /towntp [town]

  tollwarp:
    description: Paid warp points
    usage: /tollwarp <list|mywarps|create|delete|setprice|tp|info>
    aliases: [publichomes]

  tplog:
    description: Teleport log and rewind
    usage: /tplog <player>
    permission: novateleport.admin.rewind
