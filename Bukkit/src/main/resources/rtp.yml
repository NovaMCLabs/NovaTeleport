# 高性能随机传送 rtp.yml
# 后台异步预生成坐标池，玩家执行 /rtp 时优先从池中取坐标，实现瞬时传送。

# 预生成坐标池大小
pregen_pool_size: 50

worlds:
  world:
    enabled: true
    center_x: 0
    center_z: 0
    # 半径范围。注意：/rtp 与坐标池都只会落在「玩家已经生成过」的区块里
    # （未加载的区块会被跳过，绝不为了传送而同步生成区块，否则会卡死服务器主线程）。
    # 因此在全新服务器上（默认视距 10 区块 ≈ 出生点周围 160 格），如果 min_radius 远大于
    # 已探索范围，/rtp 会找不到落点并提示 rtp.no_safe，直到玩家向外探索或使用区块预生成插件。
    # 默认值 64/512 即落在全新世界的已探索范围内，/rtp 开箱即用；调大半径前请先扩大探索范围，
    # 否则会重新回到上面的 rtp.no_safe 情形。
    #
    # NOTE: /rtp and the coordinate pool only ever land in chunks that are ALREADY generated —
    # unloaded candidates are skipped rather than synchronously generated (that would freeze the
    # tick thread). On a fresh world this means the radius must stay inside the explored area,
    # otherwise /rtp reports rtp.no_safe.
    min_radius: 64
    max_radius: 512
    biome_blacklist:
      - "OCEAN"
      - "DEEP_OCEAN"
  nether:
    enabled: false

# 可配置的禁止降落方块（脚下不能是这些）
safe_landing_note: "脚下不能为以下方块"
unsafe_landing_blocks:
  - "LAVA"
  - "WATER"
  - "FIRE"
  - "CACTUS"
  - "MAGMA_BLOCK"
  - "AIR"
  - "VOID_AIR"
  - "CAVE_AIR"
  - "SWEET_BERRY_BUSH"
  - "WITHER_ROSE"
